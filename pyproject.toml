[project]
name = "adk-retail-agent"
version = "0.1.0"
description = "Customer Order and Operations Agent for Cymbal Retail"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "google-adk[eval,otel-gcp]>=2.0.0",
    "google-cloud-aiplatform[adk,agent_engines,evaluation]>=1.112.0",
    "google-cloud-firestore>=2.19.0",
    "google-cloud-resource-manager>=1.18.0",
    "google-genai>=1.0.0",
    "opentelemetry-api>=1.26.0",
    "opentelemetry-exporter-gcp-trace>=1.6.0",
    "opentelemetry-sdk>=1.26.0",
    "pydantic>=2.8.0",
    "requests>=2.31.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0"
]


[tool.pytest.ini_options]
addopts = [
    "--disable-warnings", 
    "--no-header", 
    "--verbose",
    "--durations=0"
]
markers = [
    "unit: Unit tests",
    "integration: (Database) Integration tests",
    "eval: (Agent) Evaluation tests"
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
]
ignore = ["E501"]  # line length

[tool.ruff.lint.isort]
lines-between-types = 1
