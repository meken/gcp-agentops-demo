[project]
name = "adk-retail-agent"
version = "0.1.0"
description = "Customer Order and Operations Agent for Cymbal Retail"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "fastapi==0.141.1",
    "google-adk[eval,otel-gcp]==2.8.0",
    "google-cloud-aiplatform[adk,agent_engines,evaluation]==2.0.1",
    "google-cloud-firestore==2.29.0",
    "google-cloud-resource-manager==1.18.0",
    "google-genai==2.20.0",
    "opentelemetry-api==1.42.1",
    "opentelemetry-exporter-gcp-trace>=1.15.0",
    "opentelemetry-sdk>=1.42.1",
    "pydantic==2.13.4",
    "requests==2.34.2",
    "uvicorn[standard]==0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0"
]

[tool.pytest.ini_options]
addopts = [
    "--disable-warnings",
    "--no-header", 
    "--verbose",
    "-ra",
    "--durations=0",
    "-m not sanitization",
]
markers = [
    "unit: Unit tests",
    "integration: (Database) Integration tests",
    "eval: (Agent) Evaluation tests",
    "sanitization: (Security) Sanitization and adversarial tests",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
]
ignore = ["E501"]  # line length

[tool.ruff.lint.isort]
lines-between-types = 1
